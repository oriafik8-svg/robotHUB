<!DOCTYPE html>

<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שליטה ברובוט</title>

<style>
body{
  margin:0;
  font-family:system-ui,Arial;
  background:#111827;
  color:#e5e7eb;
  display:flex;
  height:100vh;
  overflow:hidden
}

#l{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:10px;
  min-width:0
}

#r{
  width:340px;
  background:#1f2937;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px
}

canvas{
  flex:1;
  background:#0b1220;
  border-radius:8px;
  width:100%;
  min-height:0
}

button{
  background:#2563eb;
  color:#fff;
  border:0;
  border-radius:6px;
  padding:8px 12px;
  cursor:pointer;
  font-size:14px
}

button:hover{
  filter:brightness(1.08)
}

button.g{
  background:#374151
}

button.red{
  background:#dc2626
}

input{
  background:#0b1220;
  color:#e5e7eb;
  border:1px solid #374151;
  border-radius:6px;
  padding:8px;
  outline:none
}

input:focus{
  border-color:#2563eb
}

#bar{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:8px;
  align-items:center
}

#chat{
  flex:1;
  overflow:auto;
  background:#0b1220;
  border-radius:6px;
  padding:8px;
  font-size:14px
}

.u{
  color:#93c5fd;
  margin:4px 0
}

.a{
  color:#86efac;
  margin:4px 0
}

.s{
  color:#9ca3af;
  font-size:12px
}
</style>

</head>

<body>

<div id="l">
  <div id="bar">
    <button onclick="connectBle()">חבר רובוט (Bluetooth)</button>
    <button class="g" onclick="connect()">USB</button>

```
<button onclick="send('GO')">▶ סע</button>
<button class="red" onclick="send('STOP')">■ עצור</button>
<button class="g" onclick="send('HOME')">🏠 הביתה</button>
<button class="g" onclick="send('EXPLORE')">🧭 חקור</button>
<button class="g" onclick="clearMap()">נקה מפה</button>

<span id="st" class="s">לא מחובר</span>
```

  </div>

<canvas id="c"></canvas>

  <div id="info" class="s" style="margin-top:6px"></div>
</div>

<div id="r">
  <input
    id="key"
    type="password"
    placeholder="Gemini API key"
    onchange="saveKey()"
  >

  <div id="chat"></div>

<input
id="msg"
placeholder="למשל: תעצור ותחזור הביתה"
onkeydown="if(event.key==='Enter')ask()"

>

<button onclick="ask()">שלח ל-Gemini</button>

</div>

<script>

/* =========================================================
   כללי
   ========================================================= */

const $ = id => document.getElementById(id);

/* =========================================================
   Gemini
   ========================================================= */

/*
  Gemini REST API.
  אפשר להחליף כאן מודל בעתיד בלי לשנות שום דבר אחר.
*/
const GEMINI_MODEL = 'gemini-3.8-flash';

let geminiKey = '';

try{
  geminiKey = localStorage.getItem('rk') || '';
  $('key').value = geminiKey;
}catch(e){
  geminiKey = '';
}

function saveKey(){
  try{
    geminiKey = $('key').value.trim();
    localStorage.setItem('rk', geminiKey);
  }catch(e){
    geminiKey = $('key').value.trim();
  }
}

/* =========================================================
   מצב הרובוט
   ========================================================= */

let writer = null;

let pose = {
  x:0,
  y:0,
  h:0,
  m:0
};

let trail = [];
let obs = [];
let edges = [];
let log = [];

/* =========================================================
   מפה
   ========================================================= */

function clearMap(){
  trail = [];
  obs = [];
  edges = [];
  log = [];
}

/* =========================================================
   USB
   ========================================================= */

async function connect(){

  try{

    if(!('serial' in navigator)){
      throw new Error('הדפדפן לא תומך ב-Web Serial');
    }

    const port = await navigator.serial.requestPort();

    await port.open({
      baudRate:115200
    });

    const enc = new TextEncoderStream();

    enc.readable.pipeTo(port.writable);

    writer = enc.writable.getWriter();

    const dec = new TextDecoderStream();

    port.readable.pipeTo(dec.writable);

    const rd = dec.readable.getReader();

    let buf = '';

    $('st').textContent = 'מחובר (USB)';

    while(true){

      const {value,done} = await rd.read();

      if(done) break;

      buf += value;

      let i;

      while((i = buf.indexOf('\n')) >= 0){

        const raw = buf.slice(0,i).trim();

        buf = buf.slice(i+1);

        line(raw);
      }
    }

  }catch(e){

    $('st').textContent = 'שגיאה: ' + e.message;

  }

  $('st').textContent = 'לא מחובר';

  writer = null;
}

/* =========================================================
   Bluetooth - Pybricks
   ========================================================= */

/*
  Pybricks Hub שלך מפרסם את Nordic UART Service:
  6e400001-b5a3-f393-e0a9-e50e24dcca9e

  אנחנו מחפשים לפי השירות ולא לפי שם.
  זה יותר אמין כי בפועל ה-Hub מזוהה אצלך כ-"Pybricks Hub".
*/

const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';

const NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_RX = '6e400002-b5a3-f393-e0a9-e50e';

async function connectBle(){

  try{

    if(!('bluetooth' in navigator)){
      throw new Error('הדפדפן לא תומך ב-Web Bluetooth');
    }

    const dev = await navigator.bluetooth.requestDevice({
      filters:[
        {
          services:[NUS]
        }
      ]
    });

    $('st').textContent = 'מתחבר ל-' + (dev.name || 'Hub') + '...';

    const server = await dev.gatt.connect();

    const svc = await server.getPrimaryService(NUS);

    const tx = await svc.getCharacteristic(NUS_TX);
    const rx = await svc.getCharacteristic(NUS_RX);

    let buf = '';

    const dec = new TextDecoder();

    tx.addEventListener(
      'characteristicvaluechanged',
      e => {

        buf += dec.decode(
          e.target.value,
          {stream:true}
        );

        let i;

        while((i = buf.indexOf('\n')) >= 0){

          const raw = buf.slice(0,i).trim();

          buf = buf.slice(i+1);

          line(raw);
        }
      }
    );

    await tx.startNotifications();

    writer = {
      write: async text => {

        const bytes = new TextEncoder().encode(text);

        /*
          20 bytes בכל כתיבה כדי להיות בטוחים
          מול MTU קטן של BLE.
        */

        for(let i=0; i<bytes.length; i+=20){

          const chunk = bytes.slice(i,i+20);

          await rx.writeValueWithoutResponse(chunk);
        }
      }
    };

    dev.addEventListener(
      'gattserverdisconnected',
      () => {

        writer = null;

        $('st').textContent = 'נותק';
      }
    );

    $('st').textContent = 'מחובר (Bluetooth)';

  }catch(e){

    $('st').textContent = 'שגיאה: ' + e.message;
  }
}

/* =========================================================
   שליחת פקודות לרובוט
   ========================================================= */

function send(c){

  if(writer){

    writer.write(c + '\n');

  }else{

    $('st').textContent = 'לא מחובר';
  }
}

/* =========================================================
   קריאת נתונים מהרובוט
   ========================================================= */

function near(a,x,y){

  return a.some(
    p =>
      (p[0]-x)**2 +
      (p[1]-y)**2 <
      60*60
  );
}

function line(s){

  const p = s.split(',');

  if(
    p[0] === 'P' &&
    p.length >= 5
  ){

    pose = {
      x:+p[1],
      y:+p[2],
      h:+p[3],
      m:+p[4]
    };

    trail.push([
      pose.x,
      pose.y
    ]);

    if(trail.length > 3000){
      trail.shift();
    }

  }

  else if(
    p[0] === 'O' &&
    p.length >= 3 &&
    !near(obs,+p[1],+p[2])
  ){

    obs.push([
      +p[1],
      +p[2]
    ]);

  }

  else if(
    p[0] === 'E' &&
    p.length >= 3 &&
    !near(edges,+p[1],+p[2])
  ){

    edges.push([
      +p[1],
      +p[2]
    ]);

  }

  else if(s){

    log.push(s);

    if(log.length > 5){
      log.shift();
    }
  }
}

/* =========================================================
   ציור המפה
   ========================================================= */

const cv = $('c');
const g = cv.getContext('2d');

function draw(){

  cv.width = cv.clientWidth;
  cv.height = cv.clientHeight;

  const all = [
    ...trail,
    ...obs,
    ...edges,
    [pose.x,pose.y],
    [0,0]
  ];

  const xs = all.map(a => a[0]);
  const ys = all.map(a => a[1]);

  let x0 = Math.min(...xs) - 150;
  let x1 = Math.max(...xs) + 150;

  let y0 = Math.min(...ys) - 150;
  let y1 = Math.max(...ys) + 150;

  const sc = Math.min(
    cv.width / Math.max(1,x1-x0),
    cv.height / Math.max(1,y1-y0)
  );

  const X = x =>
    (x-x0)*sc +
    (cv.width-(x1-x0)*sc)/2;

  const Y = y =>
    cv.height -
    (
      (y-y0)*sc +
      (cv.height-(y1-y0)*sc)/2
    );

  /* מסלול */

  g.strokeStyle = '#38bdf8';

  g.beginPath();

  trail.forEach((t,i) => {

    if(i){
      g.lineTo(
        X(t[0]),
        Y(t[1])
      );
    }else{
      g.moveTo(
        X(t[0]),
        Y(t[1])
      );
    }

  });

  g.stroke();

  /* מכשולים */

  g.fillStyle = '#facc15';

  obs.forEach(o => {

    g.beginPath();

    g.arc(
      X(o[0]),
      Y(o[1]),
      Math.max(4,50*sc),
      0,
      7
    );

    g.fill();
  });

  /* קצוות */

  g.fillStyle = '#ef4444';

  edges.forEach(o => {

    g.fillRect(
      X(o[0])-6,
      Y(o[1])-6,
      12,
      12
    );
  });

  /* בית */

  g.fillStyle = '#22c55e';

  g.font = '16px Arial';

  g.fillText(
    '🏠',
    X(0)-8,
    Y(0)+6
  );

  /* הרובוט */

  const a =
    pose.h *
    Math.PI /
    180;

  g.save();

  g.translate(
    X(pose.x),
    Y(pose.y)
  );

  g.rotate(-a);

  g.fillStyle = '#fff';

  g.beginPath();

  g.moveTo(14,0);
  g.lineTo(-10,-8);
  g.lineTo(-10,8);
  g.fill();

  g.restore();

  $('info').textContent =
    `מיקום (${pose.x|0}, ${pose.y|0}) מ"מ · ` +
    `כיוון ${pose.h|0}° · ` +
    `מצב ${pose.m===1 ? 'הביתה' : 'חקירה'} · ` +
    `מכשולים ${obs.length} · ` +
    `קצוות ${edges.length} ` +
    `${log.join(' | ')}`;

  requestAnimationFrame(draw);
}

draw();

/* =========================================================
   צ'אט
   ========================================================= */

function add(cls,t){

  const d = document.createElement('div');

  d.className = cls;

  d.textContent = t;

  $('chat').appendChild(d);

  $('chat').scrollTop = 1e9;
}

/* =========================================================
   Gemini
   ========================================================= */

async function ask(){

  const q = $('msg').value.trim();

  if(!q){
    return;
  }

  $('msg').value = '';

  add('u',q);

  const key = $('key').value.trim();

  if(!key){

    add(
      's',
      'הכנס Gemini API key'
    );

    return;
  }

  saveKey();

  const state =
    `מיקום (${pose.x|0}, ${pose.y|0}) מ"מ, ` +
    `כיוון ${pose.h|0}°, ` +
    `מצב ${pose.m===1 ? 'הביתה' : 'חקירה'}, ` +
    `מכשולים שנמצאו ${obs.length}, ` +
    `קצוות ${edges.length}`;

  const systemText = `
אתה המוח של רובוט LEGO המחובר למשתמש.

ענה בעברית קצרה וברורה.

אתה חייב להחזיר JSON בלבד.

המבנה חייב להיות:
{
  "say": "תשובה קצרה למשתמש",
  "cmds": []
}

פקודות מותרות בלבד:
GO
STOP
HOME
EXPLORE

GO = להתחיל/להמשיך לנסוע.
STOP = לעצור.
HOME = לחזור לנקודת הבית.
EXPLORE = לעבור למצב חקירה.

אפשר להחזיר כמה פקודות ברצף.

אם אין צורך לבצע פעולה ברובוט:
"cmds": []

אל תמציא פקודות אחרות.

מצב הרובוט:
${state}
`.trim();

  const url =
    `https://generativelanguage.googleapis.com/v1beta/models/` +
    `${GEMINI_MODEL}:generateContent`;

  try{

    const response = await fetch(
      url,
      {
        method:'POST',

        headers:{
          'Content-Type':'application/json',
          'x-goog-api-key':key
        },

        body:JSON.stringify({

          system_instruction:{
            parts:[
              {
                text:systemText
              }
            ]
          },

          contents:[
            {
              role:'user',
              parts:[
                {
                  text:q
                }
              ]
            }
          ],

          generationConfig:{

            maxOutputTokens:400,

            responseMimeType:'application/json',

            responseSchema:{

              type:'OBJECT',

              properties:{

                say:{
                  type:'STRING'
                },

                cmds:{
                  type:'ARRAY',

                  items:{
                    type:'STRING',

                    enum:[
                      'GO',
                      'STOP',
                      'HOME',
                      'EXPLORE'
                    ]
                  }
                }
              },

              required:[
                'say',
                'cmds'
              ]
            }
          }
        })
      }
    );

    const j = await response.json();

    if(!response.ok){

      const message =
        j?.error?.message ||
        `HTTP ${response.status}`;

      throw new Error(message);
    }

    const text =
      j?.candidates?.[0]?.content?.parts
        ?.map(p => p.text || '')
        .join('')
        .trim();

    if(!text){

      throw new Error(
        'Gemini החזיר תשובה ללא טקסט'
      );
    }

    let o;

    try{

      o = JSON.parse(text);

    }catch(e){

      throw new Error(
        'Gemini החזיר JSON לא תקין'
      );
    }

    if(
      typeof o.say !== 'string' ||
      !Array.isArray(o.cmds)
    ){

      throw new Error(
        'מבנה התשובה של Gemini אינו תקין'
      );
    }

    add(
      'a',
      o.say
    );

    for(const c of o.cmds){

      if(
        ['GO','STOP','HOME','EXPLORE']
          .includes(c)
      ){

        send(c);

        add(
          's',
          'נשלח: ' + c
        );
      }
    }

  }catch(e){

    add(
      's',
      'שגיאת Gemini: ' + e.message
    );
  }
}

</script>

</body>
</html>
