<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>שליטה ברובוט</title>
<style>
body{margin:0;font-family:system-ui,Arial;background:#111827;color:#e5e7eb;display:flex;height:100vh}
#l{flex:1;display:flex;flex-direction:column;padding:10px;min-width:0}
#r{width:340px;background:#1f2937;padding:10px;display:flex;flex-direction:column;gap:8px}
canvas{flex:1;background:#0b1220;border-radius:8px;width:100%;min-height:0}
button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:8px 12px;cursor:pointer;font-size:14px}
button.g{background:#374151}button.red{background:#dc2626}
input{background:#0b1220;color:#e5e7eb;border:1px solid #374151;border-radius:6px;padding:8px}
#bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
#chat{flex:1;overflow:auto;background:#0b1220;border-radius:6px;padding:8px;font-size:14px}
.u{color:#93c5fd;margin:4px 0}.a{color:#86efac;margin:4px 0}.s{color:#9ca3af;font-size:12px}
</style></head><body>
<div id="l">
 <div id="bar">
  <button onclick="connectBle()">חבר רובוט (Bluetooth)</button>
  <button class="g" onclick="connect()">USB</button>
  <button onclick="send('GO')">▶ סע</button>
  <button class="red" onclick="send('STOP')">■ עצור</button>
  <button class="g" onclick="send('HOME')">🏠 הביתה</button>
  <button class="g" onclick="send('EXPLORE')">🧭 חקור</button>
  <button class="g" onclick="clearMap()">נקה מפה</button>
  <span id="st" class="s">לא מחובר</span>
 </div>
 <canvas id="c"></canvas>
 <div id="info" class="s" style="margin-top:6px"></div>
</div>
<div id="r">
 <input id="key" type="password" placeholder="Claude API key" onchange="saveKey()">
 <div id="chat"></div>
 <input id="msg" placeholder="למשל: תעצור ותחזור הביתה" onkeydown="if(event.key=='Enter')ask()">
 <button onclick="ask()">שלח ל-Claude</button>
</div>
<script>
const $=id=>document.getElementById(id);
let writer=null,pose={x:0,y:0,h:0,m:0},trail=[],obs=[],edges=[],log=[];
try{$('key').value=localStorage.getItem('rk')||''}catch(e){}
function saveKey(){try{localStorage.setItem('rk',$('key').value)}catch(e){}}
function clearMap(){trail=[];obs=[];edges=[]}

async function connect(){
 try{
  const port=await navigator.serial.requestPort();await port.open({baudRate:115200});
  const enc=new TextEncoderStream();enc.readable.pipeTo(port.writable);writer=enc.writable.getWriter();
  const dec=new TextDecoderStream();port.readable.pipeTo(dec.writable);
  const rd=dec.readable.getReader();let buf='';$('st').textContent='מחובר';
  while(true){const{value,done}=await rd.read();if(done)break;buf+=value;let i;
   while((i=buf.indexOf('\n'))>=0){line(buf.slice(0,i).trim());buf=buf.slice(i+1)}}
 }catch(e){$('st').textContent='שגיאה: '+e.message}
 $('st').textContent='לא מחובר';writer=null;
}
function send(c){if(writer)writer.write(c+'\n');else $('st').textContent='לא מחובר'}
const NUS='6e400001-b5a3-f393-e0a9-e50e24dcca9e';
async function connectBle(){
 try{
  const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'Robot'}],optionalServices:[NUS]});
  const svc=await(await dev.gatt.connect()).getPrimaryService(NUS);
  const tx=await svc.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');
  const rx=await svc.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
  let buf='';const dec=new TextDecoder();
  tx.addEventListener('characteristicvaluechanged',e=>{buf+=dec.decode(e.target.value);let i;
   while((i=buf.indexOf('\n'))>=0){line(buf.slice(0,i).trim());buf=buf.slice(i+1)}});
  await tx.startNotifications();
  writer={write:async t=>{const b=new TextEncoder().encode(t);for(let i=0;i<b.length;i+=20)await rx.writeValueWithoutResponse(b.slice(i,i+20))}};
  dev.addEventListener('gattserverdisconnected',()=>{writer=null;$('st').textContent='נותק'});
  $('st').textContent='מחובר (Bluetooth)';
 }catch(e){$('st').textContent='שגיאה: '+e.message}
}
function near(a,x,y){return a.some(p=>(p[0]-x)**2+(p[1]-y)**2<60*60)}
function line(s){
 const p=s.split(',');
 if(p[0]=='P'&&p.length>=5){pose={x:+p[1],y:+p[2],h:+p[3],m:+p[4]};trail.push([pose.x,pose.y]);if(trail.length>3000)trail.shift()}
 else if(p[0]=='O'&&!near(obs,+p[1],+p[2]))obs.push([+p[1],+p[2]]);
 else if(p[0]=='E'&&!near(edges,+p[1],+p[2]))edges.push([+p[1],+p[2]]);
 else if(s){log.push(s);if(log.length>5)log.shift()}
}

const cv=$('c'),g=cv.getContext('2d');
function draw(){
 cv.width=cv.clientWidth;cv.height=cv.clientHeight;
 const all=[...trail,...obs,...edges,[pose.x,pose.y],[0,0]];
 let x0=Math.min(...all.map(a=>a[0]))-150,x1=Math.max(...all.map(a=>a[0]))+150;
 let y0=Math.min(...all.map(a=>a[1]))-150,y1=Math.max(...all.map(a=>a[1]))+150;
 const sc=Math.min(cv.width/(x1-x0),cv.height/(y1-y0));
 const X=x=>(x-x0)*sc+(cv.width-(x1-x0)*sc)/2,Y=y=>cv.height-((y-y0)*sc+(cv.height-(y1-y0)*sc)/2);
 g.strokeStyle='#38bdf8';g.beginPath();trail.forEach((t,i)=>i?g.lineTo(X(t[0]),Y(t[1])):g.moveTo(X(t[0]),Y(t[1])));g.stroke();
 g.fillStyle='#facc15';obs.forEach(o=>{g.beginPath();g.arc(X(o[0]),Y(o[1]),Math.max(4,50*sc),0,7);g.fill()});
 g.fillStyle='#ef4444';edges.forEach(o=>{g.fillRect(X(o[0])-6,Y(o[1])-6,12,12)});
 g.fillStyle='#22c55e';g.font='16px Arial';g.fillText('🏠',X(0)-8,Y(0)+6);
 const a=pose.h*Math.PI/180;g.save();g.translate(X(pose.x),Y(pose.y));g.rotate(-a);
 g.fillStyle='#fff';g.beginPath();g.moveTo(14,0);g.lineTo(-10,-8);g.lineTo(-10,8);g.fill();g.restore();
 $('info').textContent=`מיקום (${pose.x|0}, ${pose.y|0}) מ"מ · כיוון ${pose.h|0}° · מצב ${pose.m==1?'הביתה':'חקירה'} · מכשולים ${obs.length} · קצוות ${edges.length}  ${log.join(' | ')}`;
 requestAnimationFrame(draw);
}
draw();

function add(cls,t){const d=document.createElement('div');d.className=cls;d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=1e9}
async function ask(){
 const q=$('msg').value.trim();if(!q)return;$('msg').value='';add('u',q);
 const state=`מיקום (${pose.x|0},${pose.y|0}) מ"מ, כיוון ${pose.h|0}°, מצב ${pose.m==1?'הביתה':'חקירה'}, מכשולים שנמצאו ${obs.length}, קצוות ${edges.length}`;
 const sys='אתה המוח של רובוט LEGO. ענה בעברית קצרה. החזר JSON בלבד, בלי טקסט נוסף: {"say":"תשובה למשתמש","cmds":[...]}. פקודות מותרות בלבד: GO (סע), STOP (עצור), HOME (חזור הביתה), EXPLORE (חקור). אם אין צורך בפעולה, cmds ריק. מצב הרובוט: '+state;
 try{
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':$('key').value,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
   body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:400,system:sys,messages:[{role:'user',content:q}]})});
  const j=await r.json();if(j.error)throw new Error(j.error.message);
  const t=j.content.map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();
  const o=JSON.parse(t);add('a',o.say||'');
  for(const c of(o.cmds||[]))if(['GO','STOP','HOME','EXPLORE'].includes(c)){send(c);add('s','נשלח: '+c)}
 }catch(e){add('s','שגיאה: '+e.message)}
}
</script></body></html>
