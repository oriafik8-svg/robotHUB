<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שליטה ברובוט</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#111827;color:#e5e7eb;display:flex;height:100vh;overflow:hidden}
#l{flex:1;display:flex;flex-direction:column;padding:10px;min-width:0}
#r{width:340px;background:#1f2937;padding:10px;display:flex;flex-direction:column;gap:8px}
canvas{flex:1;background:#0b1220;border-radius:8px;width:100%;min-height:0}
button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:8px 12px;cursor:pointer;font-size:14px}
button:hover{filter:brightness(1.08)}
button.g{background:#374151}button.red{background:#dc2626}button.green{background:#16a34a}button.orange{background:#d97706}
input{background:#0b1220;color:#e5e7eb;border:1px solid #374151;border-radius:6px;padding:8px;outline:none}
input:focus{border-color:#2563eb}
#bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
#chat{flex:1;overflow:auto;background:#0b1220;border-radius:6px;padding:8px;font-size:14px}
.u{color:#93c5fd;margin:4px 0}.a{color:#86efac;margin:4px 0}.s{color:#9ca3af;font-size:12px;margin:4px 0}
#debug{white-space:pre-wrap;background:#0b1220;border-radius:6px;padding:7px;font-size:11px;max-height:120px;overflow:auto;direction:ltr;text-align:left}
</style>
</head>
<body>
<div id="l">
  <div id="bar">
    <button class="green" onclick="connectBle()">🔵 חבר רובוט (Bluetooth)</button>
    <button class="orange" onclick="startRobotProgram()">▶ הפעל תוכנית</button>
    <button onclick="send('GO')">▶ סע</button>
    <button class="red" onclick="send('STOP')">■ עצור</button>
    <button class="g" onclick="send('HOME')">🏠 הביתה</button>
    <button class="g" onclick="send('EXPLORE')">🧭 חקור</button>
    <button class="g" onclick="clearMap()">נקה מפה</button>
    <span id="st" class="s">לא מחובר</span>
  </div>
  <canvas id="c"></canvas>
  <div id="info" class="s" style="margin-top:6px"></div>
  <div id="debug" class="s"></div>
</div>
<div id="r">
  <input id="key" type="password" placeholder="Gemini API key" onchange="saveKey()">
  <div id="chat"></div>
  <input id="msg" placeholder="למשל: תעצור ותחזור הביתה" onkeydown="if(event.key==='Enter') ask()">
  <button onclick="ask()">שלח ל-Gemini</button>
</div>
<script>
const $=id=>document.getElementById(id);
const PYBRICKS_SERVICE='c5f50001-8280-46da-89f4-6d8051e4aeef';
const PYBRICKS_COMMAND_EVENT='c5f50002-8280-46da-89f4-6d8051e4aeef';
const PYBRICKS_START_PROGRAM=1;
const NUS_SERVICE='6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_TX='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_RX='6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const GEMINI_MODEL='gemini-3.8-flash';

let geminiKey='';
try{geminiKey=localStorage.getItem('rk')||'';$('key').value=geminiKey}catch(e){}
function saveKey(){geminiKey=$('key').value.trim();try{localStorage.setItem('rk',geminiKey)}catch(e){}}

let bleDevice=null,bleServer=null,nusService=null,nusTx=null,nusRx=null,bleConnecting=false,bleProgramRunning=false;
let stdoutDecoder=new TextDecoder(),incomingBuffer='';
let pose={x:0,y:0,h:0,m:0},trail=[],obs=[],edges=[],log=[];
function clearMap(){trail=[];obs=[];edges=[];log=[]}
function setStatus(s){$('st').textContent=s}
function addDebug(s){log.push(String(s));if(log.length>12)log.shift();$('debug').textContent=log.join('\n')}

async function writeWithBestMethod(ch,data){
  if(typeof ch.writeValueWithoutResponse==='function')return ch.writeValueWithoutResponse(data);
  if(typeof ch.writeValueWithResponse==='function')return ch.writeValueWithResponse(data);
  return ch.writeValue(data);
}

async function connectNus(device){
  setStatus('מתחבר ישירות לערוץ הרובוט...');
  bleServer=await device.gatt.connect();
  nusService=await bleServer.getPrimaryService(NUS_SERVICE);
  nusTx=await nusService.getCharacteristic(NUS_TX);
  nusRx=await nusService.getCharacteristic(NUS_RX);
  await nusTx.startNotifications();
  nusTx.removeEventListener('characteristicvaluechanged',handleNusNotification);
  nusTx.addEventListener('characteristicvaluechanged',handleNusNotification);
  setStatus('מחובר · Bluetooth ישיר לרובוט');
  addDebug('NUS connected');
}

async function startSavedProgram(device){
  let server=null;
  try{
    setStatus('מפעיל את התוכנית השמורה ב-Hub...');
    server=await device.gatt.connect();
    const service=await server.getPrimaryService(PYBRICKS_SERVICE);
    const ch=await service.getCharacteristic(PYBRICKS_COMMAND_EVENT);
    await writeWithBestMethod(ch,new Uint8Array([PYBRICKS_START_PROGRAM]));
    addDebug('START_USER_PROGRAM sent');
  }catch(e){
    addDebug('Start skipped/failed: '+(e.message||e));
  }finally{
    try{if(device.gatt.connected)device.gatt.disconnect()}catch(e){}
  }
}

async function connectBle(){
  if(bleConnecting)return;
  bleConnecting=true;
  try{
    if(!('bluetooth' in navigator))throw new Error('הדפדפן לא תומך ב-Web Bluetooth');
    if(!window.isSecureContext)throw new Error('החיבור דורש HTTPS');
    setStatus('מחפש את ה-Hub...');
    const dev=await navigator.bluetooth.requestDevice({
      filters:[{services:[NUS_SERVICE]},{services:[PYBRICKS_SERVICE]}],
      optionalServices:[NUS_SERVICE,PYBRICKS_SERVICE]
    });
    bleDevice=dev;
    dev.addEventListener('gattserverdisconnected',onBleDisconnected);

    // קודם מנסים את הערוץ הישיר של התוכנית.
    try{
      await connectNus(dev);
      return;
    }catch(first){
      addDebug('NUS not running yet');
      try{if(dev.gatt.connected)dev.gatt.disconnect()}catch(e){}
    }

    // אם התוכנית לא רצה, משתמשים בשירות Pybricks רק כדי להפעיל אותה.
    await startSavedProgram(dev);

    // נותנים ל-BLE של התוכנית לעלות ואז מתחברים מחדש לערוץ NUS.
    let lastErr=null;
    for(let i=0;i<12;i++){
      await new Promise(r=>setTimeout(r,350));
      try{
        await connectNus(dev);
        return;
      }catch(e){
        lastErr=e;
        try{if(dev.gatt.connected)dev.gatt.disconnect()}catch(x){}
      }
    }
    throw lastErr||new Error('ה-NUS של הרובוט לא עלה');
  }catch(e){
    setStatus('שגיאה: '+(e.message||String(e)));
    addDebug('Bluetooth error: '+(e.message||e));
  }finally{bleConnecting=false}
}

async function startRobotProgram(){
  if(!bleDevice){setStatus('קודם לחץ על חבר רובוט (Bluetooth)');return}
  try{
    await startSavedProgram(bleDevice);
    for(let i=0;i<12;i++){
      await new Promise(r=>setTimeout(r,350));
      try{await connectNus(bleDevice);return}catch(e){}
    }
    setStatus('התוכנית הופעלה, אבל ערוץ הבקרה עדיין לא זמין');
  }catch(e){setStatus('שגיאה בהפעלת התוכנית: '+(e.message||e))}
}

function onBleDisconnected(){
  bleServer=null;nusService=null;nusTx=null;nusRx=null;bleProgramRunning=false;
  setStatus('נותק');
  addDebug('BLE disconnected');
}

async function send(c){
  if(!nusRx){setStatus('לא מחובר');return}
  try{
    const bytes=new TextEncoder().encode(c+'\n');
    await writeWithBestMethod(nusRx,bytes);
    setStatus('נשלח: '+c);
  }catch(e){setStatus('שגיאת שליחה: '+(e.message||String(e)));}
}

function handleNusNotification(event){
  const v=event.target.value;if(!v||v.byteLength===0)return;
  const data=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);
  const text=stdoutDecoder.decode(data,{stream:true});
  incomingBuffer+=text;
  let idx;
  while((idx=incomingBuffer.indexOf('\n'))>=0){
    const raw=incomingBuffer.slice(0,idx).trim();
    incomingBuffer=incomingBuffer.slice(idx+1);
    if(raw)line(raw);
  }
}

function near(a,x,y){return a.some(p=>(p[0]-x)**2+(p[1]-y)**2<60*60)}
function line(s){
  const p=s.split(',');
  if(p[0]==='P'&&p.length>=5){
    pose={x:+p[1],y:+p[2],h:+p[3],m:+p[4]};trail.push([pose.x,pose.y]);if(trail.length>3000)trail.shift();return;
  }
  if(p[0]==='O'&&p.length>=3&&!near(obs,+p[1],+p[2])){obs.push([+p[1],+p[2]]);return}
  if(p[0]==='E'&&p.length>=3&&!near(edges,+p[1],+p[2])){edges.push([+p[1],+p[2]]);return}
  if(s==='ROBOT51515_BOOT_OK'){addDebug(s);return}
  log.push(s);if(log.length>12)log.shift();
}

const cv=$('c'),g=cv.getContext('2d');
function draw(){
  cv.width=cv.clientWidth;cv.height=cv.clientHeight;
  const all=[...trail,...obs,...edges,[pose.x,pose.y],[0,0]];
  const xs=all.map(a=>a[0]),ys=all.map(a=>a[1]);
  let x0=Math.min(...xs)-150,x1=Math.max(...xs)+150,y0=Math.min(...ys)-150,y1=Math.max(...ys)+150;
  const sc=Math.min(cv.width/Math.max(1,x1-x0),cv.height/Math.max(1,y1-y0));
  const X=x=>(x-x0)*sc+(cv.width-(x1-x0)*sc)/2;
  const Y=y=>cv.height-((y-y0)*sc+(cv.height-(y1-y0)*sc)/2);
  g.clearRect(0,0,cv.width,cv.height);
  g.strokeStyle='#38bdf8';g.beginPath();
  trail.forEach((t,i)=>{if(i)g.lineTo(X(t[0]),Y(t[1]));else g.moveTo(X(t[0]),Y(t[1]))});g.stroke();
  g.fillStyle='#facc15';obs.forEach(o=>{g.beginPath();g.arc(X(o[0]),Y(o[1]),Math.max(4,50*sc),0,Math.PI*2);g.fill()});
  g.fillStyle='#ef4444';edges.forEach(o=>g.fillRect(X(o[0])-6,Y(o[1])-6,12,12));
  g.fillStyle='#22c55e';g.font='16px Arial';g.fillText('🏠',X(0)-8,Y(0)+6);
  const a=pose.h*Math.PI/180;g.save();g.translate(X(pose.x),Y(pose.y));g.rotate(-a);g.fillStyle='#fff';g.beginPath();g.moveTo(14,0);g.lineTo(-10,-8);g.lineTo(-10,8);g.fill();g.restore();
  $('info').textContent=`מיקום (${pose.x|0}, ${pose.y|0}) מ"מ · כיוון ${pose.h|0}° · מצב ${pose.m===1?'הביתה':'חקירה'} · מכשולים ${obs.length} · קצוות ${edges.length}`;
  requestAnimationFrame(draw);
}
draw();

function add(cls,t){const d=document.createElement('div');d.className=cls;d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}

async function ask(){
  const q=$('msg').value.trim();if(!q)return;$('msg').value='';add('u',q);
  const key=$('key').value.trim();if(!key){add('s','הכנס Gemini API key');return}saveKey();
  const state=`מיקום (${pose.x|0}, ${pose.y|0}) מ"מ, כיוון ${pose.h|0}°, מצב ${pose.m===1?'הביתה':'חקירה'}, מכשולים ${obs.length}, קצוות ${edges.length}, Bluetooth ${nusRx?'פעיל':'לא פעיל'}`;
  const systemText=`אתה עוזר לרובוט LEGO. אתה אופציונלי בלבד: כפתורי השליטה הישירים באתר עובדים גם בלי AI. ענה בעברית קצרה וברורה והחזר JSON בלבד. המבנה: {"say":"...","cmds":[]}. פקודות מותרות בלבד: GO, STOP, HOME, EXPLORE. אפשר כמה פקודות. מצב: ${state}`;
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
  try{
    const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({system_instruction:{parts:[{text:systemText}]},contents:[{role:'user',parts:[{text:q}]}],generationConfig:{maxOutputTokens:400,responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{say:{type:'STRING'},cmds:{type:'ARRAY',items:{type:'STRING',enum:['GO','STOP','HOME','EXPLORE']}}},required:['say','cmds']}}})});
    const j=await response.json();if(!response.ok)throw new Error(j?.error?.message||`HTTP ${response.status}`);
    const text=j?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('').trim();if(!text)throw new Error('Gemini החזיר תשובה ללא טקסט');
    const o=JSON.parse(text);if(typeof o.say!=='string'||!Array.isArray(o.cmds))throw new Error('מבנה התשובה אינו תקין');
    add('a',o.say);for(const c of o.cmds)if(['GO','STOP','HOME','EXPLORE'].includes(c)){await send(c);add('s','נשלח: '+c)}
  }catch(e){add('s','שגיאת Gemini: '+(e.message||String(e)))}
}
</script>
</body>
</html>
